<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="app-grid">
      <!-- Balance Section (Task 2.1) -->
      <header id="balance-section">
        <h1>Total Balance</h1>
        <p id="balance-display">$0.00</p>
        <p id="balance-warning" hidden aria-live="assertive"></p>
      </header>

      <!-- Transaction Form (Task 2.2) -->
      <form id="transaction-form">
        <input id="item-name" type="text" maxlength="100" placeholder="Item name" />
        <input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount" />
        <select id="category">
          <option value="">-- Select Category --</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Fun">Fun</option>
        </select>
        <button type="submit">Add</button>
        <div id="form-errors" aria-live="polite"></div>
      </form>

      <!-- Transaction List Section (Task 2.3) -->
      <section id="transaction-list-section">
        <ul id="transaction-list"></ul>
        <p id="empty-list-message" hidden>No transactions recorded yet.</p>
      </section>

      <!-- Chart Section (Task 2.4) -->
      <section id="chart-section">
        <canvas id="spending-chart"></canvas>
        <p id="chart-placeholder">No spending data available.</p>
      </section>
    </div>
  </body>
</html>
